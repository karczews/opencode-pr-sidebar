name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to main supersedes the older run; PR runs cancel per push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Render tests use OpenTUI, which needs node:ffi (added in Node 26.1.0),
  # so all jobs run Node 26.
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Audit production dependencies
        run: npm run check:audit

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Scan from the true PR base: the action otherwise starts at the
          # first commit of the (paginated) commit list.
          BASE_REF: ${{ github.event.pull_request.base.sha }}

  commits:
    name: conventional commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
          requireScope: false
          subjectPattern: ^(?=.{1,72}$)([a-z].*[^.]|[a-z])$
          subjectPatternError: Subject must start lowercase and not end with a period (imperative mood, max 72 chars).

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Lint commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check-commits.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
          else
            # Manual runs and fresh branches have an empty or zero base: only
            # the head commit exists to check.
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ -z "$(printf '%s' "$BEFORE" | tr -d '0')" ]; then
              node scripts/check-commits.mjs "${{ github.sha }}^!"
            else
              node scripts/check-commits.mjs "$BEFORE" "${{ github.sha }}"
            fi
          fi

  version-ownership:
    name: version ownership
    runs-on: ubuntu-latest
    # Release-please owns version files; feature PRs must not touch them.
    # Only runs on PRs: pushes to main are release-please merges (or
    # direct pushes, which branch rules handle).
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure release-please owns versions
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REF" == release-please--* && "$HEAD_REPO" == "$THIS_REPO" ]]; then
            echo "release-please branch: version edits allowed"
            exit 0
          fi
          version_at() {
            git show "$1:$2" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null
          }
          for file in package.json package-lock.json; do
            before="$(version_at "$BASE_SHA" "$file")"
            after="$(version_at "$HEAD_SHA" "$file")"
            if [ "$before" != "$after" ]; then
              echo "version ownership: $file version changed (${before} -> ${after}); versions are owned by release-please, do not bump manually"
              exit 1
            fi
          done
          # Bootstrap allowance: this rollout creates the manifest, so only
          # enforce it once it exists at base.
          owned=(CHANGELOG.md)
          if git cat-file -e "$BASE_SHA:.release-please-manifest.json" 2>/dev/null; then
            owned+=(.release-please-manifest.json)
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "${owned[@]}" || true)"
          if [ -n "$changed" ]; then
            echo "version ownership: these files are owned by release-please, do not edit manually:"
            echo "$changed"
            exit 1
          fi
          echo "version ownership ok"

  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows
        uses: reviewdog/action-actionlint@78b296370c5c75abca79860e9baa9846e3286a29 # v1.84.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Harden workflows
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
